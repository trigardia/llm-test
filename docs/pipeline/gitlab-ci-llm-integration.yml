# ══════════════════════════════════════════════════════════════════════
# Exemple d'intégration GitLab CI — LLM Security Review dans le pipeline
# Contexte : Red Team DevSecOps — pipeline aux côtés de Trivy
#
# Architecture pipeline recommandée :
#   Stage 1 : lint / unit tests
#   Stage 2 : trivy (SAST + container scan) ← déjà en place
#   Stage 3 : llm-security-review ← nouveau, basé sur ce projet
#   Stage 4 : deploy (conditionnel sur Stage 2+3)
#
# Prérequis GitLab :
#   - Runner avec GPU (si modèle > 14b) ou CPU M-series
#   - Ollama installé sur le runner (make start sur le runner)
#   - Variables CI_JOB_TOKEN, OLLAMA_HOST configurées
# ══════════════════════════════════════════════════════════════════════

stages:
  - test
  - sast
  - llm-security-review
  - deploy

# ── Variables globales ─────────────────────────────────────────────────
variables:
  OLLAMA_HOST: "http://localhost:11434"
  LLM_MODEL: "codestral:22b"           # modèle par défaut — à ajuster selon les scores
  SECURITY_THRESHOLD: "12"             # score minimum /20 pour passer (sinon fail)
  TRIVY_SEVERITY: "CRITICAL,HIGH"

# ── Stage : Trivy SAST (existant) ─────────────────────────────────────
trivy-sast:
  stage: sast
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 1 --severity $TRIVY_SEVERITY --format sarif -o trivy-results.sarif .
  artifacts:
    reports:
      sast: trivy-results.sarif
    expire_in: 30 days
  allow_failure: false

# ── Stage : LLM Security Review ───────────────────────────────────────
llm-security-review:
  stage: llm-security-review
  tags:
    - ollama-runner          # runner avec Ollama installé
  before_script:
    - ollama pull $LLM_MODEL || true
    - make ollama-check
  script:
    - |
      echo "=== LLM Security Review — $LLM_MODEL ==="
      # Teste les fichiers PHP/Python/JS modifiés dans ce MR
      CHANGED_FILES=$(git diff --name-only $CI_MERGE_REQUEST_DIFF_BASE_SHA HEAD \
        | grep -E '\.(php|py|js|ts|java)$' | head -20 || echo "")

      if [ -z "$CHANGED_FILES" ]; then
        echo "Aucun fichier source modifié — skip LLM review"
        exit 0
      fi

      # Pour chaque fichier modifié, lancer le review
      TOTAL_SCORE=0
      FILE_COUNT=0
      FAILED_FILES=""

      while IFS= read -r file; do
        if [ -f "$file" ]; then
          echo "--- Reviewing: $file ---"
          PROMPT_TEMPLATE=$(cat tests/security/prompts/security-audit-prompt.md)
          CODE=$(cat "$file")
          PROMPT="${PROMPT_TEMPLATE//\{\{CODE\}\}/$CODE}"

          RESPONSE=$(echo "$PROMPT" | ollama run $LLM_MODEL 2>/dev/null || echo "ERROR")

          # Extraction du score
          SCORE=$(echo "$RESPONSE" | grep -oE '[0-9]{1,2}/20' | head -1 | cut -d'/' -f1)
          SCORE=${SCORE:-0}

          echo "  Score: $SCORE/20 pour $file"
          TOTAL_SCORE=$(( TOTAL_SCORE + SCORE ))
          FILE_COUNT=$(( FILE_COUNT + 1 ))

          # Seuil de sécurité
          if [ "$SCORE" -lt "$SECURITY_THRESHOLD" ]; then
            FAILED_FILES="$FAILED_FILES\n  ❌ $file (score: $SCORE/20 < $SECURITY_THRESHOLD)"
          fi

          # Sauvegarde du rapport
          echo "# LLM Review: $file" >> llm-security-report.md
          echo "**Score**: $SCORE/20" >> llm-security-report.md
          echo "" >> llm-security-report.md
          echo "$RESPONSE" >> llm-security-report.md
          echo "---" >> llm-security-report.md
        fi
      done <<< "$CHANGED_FILES"

      # Rapport final
      if [ $FILE_COUNT -gt 0 ]; then
        AVG_SCORE=$(( TOTAL_SCORE / FILE_COUNT ))
        echo ""
        echo "=== RÉSUMÉ LLM SECURITY REVIEW ==="
        echo "Modèle     : $LLM_MODEL"
        echo "Fichiers   : $FILE_COUNT"
        echo "Score moyen: $AVG_SCORE/20"

        if [ -n "$FAILED_FILES" ]; then
          echo ""
          echo "FICHIERS SOUS LE SEUIL ($SECURITY_THRESHOLD/20) :"
          echo -e "$FAILED_FILES"
          echo ""
          echo "❌ LLM Security Review FAILED — corriger les vulnérabilités détectées"
          exit 1
        else
          echo "✅ LLM Security Review PASSED"
        fi
      fi

  artifacts:
    paths:
      - llm-security-report.md
    expire_in: 30 days
    when: always
  allow_failure: false  # ← passer en true pour mode warning uniquement
  only:
    - merge_requests
    - main
    - develop

# ── Stage : Deploy (conditionnel) ─────────────────────────────────────
deploy-staging:
  stage: deploy
  script:
    - echo "Deploy to staging..."
  environment:
    name: staging
  needs:
    - trivy-sast
    - llm-security-review
  only:
    - main
